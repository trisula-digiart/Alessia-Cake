        { product_id: 'PRD-03', category: 'Pastry', name: 'Berry Glazed Croissant', description: 'Croissant renyah mentega Prancis dengan selai beri.', base_price: 28000, image_url: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=600', is_active: true, stock_qty: 40 },
        { product_id: 'PRD-04', category: 'Whole Cake', name: 'Ruby Chocolate Ganache', description: 'Cokelat ruby merah muda alami.', base_price: 380000, image_url: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=600', is_active: true, stock_qty: 8 }

      ],
      recipes: [],
      orders: [
        { 
          order_id: 'ORD-7263', 
          order_type: 'Online (QRIS/Transfer)', 
          customer_name: 'Manong', 
          customer_phone: '08123456789', 
          total_amount: 300000, 
          payment_status: 'PAID', 
          order_status: 'Dibuat', 
          created_at: new Date(Date.now() - 15 * 60000).toISOString(),
          items: [{ name: 'Pink Champagne Velvet', qty: 1 }]
        },
        { 
          order_id: 'ORD-3788', 
          order_type: 'Online (Bayar di Tempat / COD)', 
          customer_name: 'Manong', 
          customer_phone: '08123456789', 
          total_amount: 280000, 
          payment_status: 'UNPAID', 
          order_status: 'Siap', 
          created_at: new Date(Date.now() - 30 * 60000).toISOString(),

        }
      ],
      expenses: [
        { expense_id: 'EXP-1001', category: 'Bahan Baku', description: 'Telur Ayam & Susu UHT', amount: 380000, date: new Date().toISOString() }
      ],
      cart: []
    };

    const roleTabs = {
      owner: [
        { id: 'dashboard', name: 'Halaman Utama', icon: 'bar-chart-3' },
        { id: 'web_orders', name: 'Pesanan Online Masuk', icon: 'bell' },
        { id: 'offline_orders', name: 'Pesanan Offline', icon: 'calculator' },
        { id: 'kds', name: 'SEDANG DALAM PROSES', icon: 'chef-hat' },
        { id: 'catalog', name: 'Katalog Produk', icon: 'package' },
        { id: 'bom', name: 'Resep KUE', icon: 'book-open' },
        { id: 'update_stock', name: 'Stok Bahan-Bahan', icon: 'database' },
        { id: 'finance', name: 'Bank Alessia', icon: 'wallet' },
        { id: 'settings', name: 'Pengaturan Owner', icon: 'settings' }
      ],
      customer: [
        { id: 'catalog', name: 'Menu Utama', icon: 'shopping-bag' },
        { id: 'custom_builder', name: 'Custom Cake', icon: 'sliders' },
        { id: 'checkout', name: 'Keranjang', icon: 'shopping-cart' }
      ]
    };

    window.initLuxuryClock = function() {
      if (window.clockTimerId) clearInterval(window.clockTimerId);
      function updateClock() {
        const timeEl = document.getElementById('luxury-clock-time');
        const dateEl = document.getElementById('luxury-clock-date');
        if (!timeEl || !dateEl) return;
        const now = new Date();
        timeEl.innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';
        dateEl.innerText = `${STORE_CONFIG.location_name || 'Kab. Bekasi'} • ${now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
      }
      updateClock();
      window.clockTimerId = setInterval(updateClock, 1000);
    };

    /* ==========================================================
     * 2. AUTHENTICATION MODULE
     * ========================================================== */
    window.openAuthModal = function() {
      const modal = document.getElementById('auth-gatekeeper-modal');
      if (modal) modal.classList.remove('hidden');
    };

    window.closeAuthModal = function() {
      const modal = document.getElementById('auth-gatekeeper-modal');
      if (modal) modal.classList.add('hidden');
    };

    window.switchAuthTab = function(type) {
      const custBtn = document.getElementById('tab-auth-customer');
      const staffBtn = document.getElementById('tab-auth-staff');
      const custForm = document.getElementById('auth-customer-form');
      const staffForm = document.getElementById('auth-staff-form');

      if (type === 'customer') {
        custBtn.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl bg-pinkglass-600 text-white shadow-md transition-all';
        staffBtn.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl text-pinkglass-800 hover:text-charcoal transition-all';
        custForm.classList.remove('hidden');
        staffForm.classList.add('hidden');
      } else {
        staffBtn.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl bg-pinkglass-600 text-white shadow-md transition-all';
        custBtn.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl text-pinkglass-800 hover:text-charcoal transition-all';
        staffForm.classList.remove('hidden');
        custForm.classList.add('hidden');
      }
    };

    window.submitCustomerLogin = function() {
      const name = document.getElementById('login-cust-name')?.value.trim();
      const phone = document.getElementById('login-cust-phone')?.value.trim();
      if (!name || !phone) return alert('Mohon isi nama dan WhatsApp');
      currentUser = { name, phone, role: 'customer', isLoggedIn: true };
      localStorage.setItem('ALESSIA_USER', JSON.stringify(currentUser));
      window.updateUserProfileDisplay();
      window.closeAuthModal();
      window.switchRole('customer');
    };

    window.submitStaffLogin = function() {
      const pin = document.getElementById('login-staff-pin')?.value.trim();
      if (pin !== STORE_CONFIG.staff_pin) return alert('PIN Keamanan Staf salah!');
      currentUser = { name: STORE_CONFIG.owner_name, phone: 'INTERNAL', role: 'owner', isLoggedIn: true };
      localStorage.setItem('ALESSIA_USER', JSON.stringify(currentUser));
      window.updateUserProfileDisplay();
      window.closeAuthModal();
      window.switchRole('owner');
    };

    window.updateUserProfileDisplay = function() {
      const el = document.getElementById('display-user-name');
      if (el) el.innerText = currentUser.name || 'Tamu VIP';
    };

    window.logoutUser = function() {
      localStorage.removeItem('ALESSIA_USER');
      currentUser = { name: '', phone: '', role: 'customer', isLoggedIn: false };
      window.updateUserProfileDisplay();
      window.switchRole('customer');
      window.openAuthModal();
    };

    window.switchRole = function(role) {
      currentRole = role;
      currentUser.role = role;
      const tabs = roleTabs[role] || roleTabs['customer'];
      currentTab = tabs[0].id;
      window.renderNavigation();
      window.renderViewport();
    };

    window.changeTab = function(tabId) {
      currentTab = tabId;
      window.renderNavigation();
      window.renderViewport();
    };

    window.renderNavigation = function() {
      const sidebar = document.getElementById('sidebar-nav');
      const mobileNav = document.getElementById('mobile-bottom-nav');
      const tabs = roleTabs[currentRole] || roleTabs['customer'];

      const pendingOrdersCount = appData.orders.filter(o => o.order_status === 'Pending').length;
      const processOrdersCount = appData.orders.filter(o => ['Dibuat', 'Dihias', 'Siap'].includes(o.order_status)).length;

      if (sidebar) {
        let sideHtml = `<div class="text-[11px] font-bold uppercase tracking-wider text-pinkglass-700 px-3 py-2">Menu ${currentRole.toUpperCase()}</div>`;
        tabs.forEach(tab => {
          const active = currentTab === tab.id;
          let badge = '';
          if (tab.id === 'web_orders' && pendingOrdersCount > 0) {
            badge = `<span class="ml-auto bg-rose-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full animate-pulse">${pendingOrdersCount}</span>`;
          } else if (tab.id === 'kds' && processOrdersCount > 0) {
            badge = `<span class="ml-auto bg-amber-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full">${processOrdersCount}</span>`;
          }

          sideHtml += `
            <button onclick="window.changeTab('${tab.id}')" class="flex items-center space-x-3 px-3.5 py-3 rounded-2xl text-xs font-semibold transition-all ${active ? 'bg-pinkglass-600 text-white shadow-md' : 'text-charcoal hover:bg-pinkglass-100/60'}">
              <i data-lucide="${tab.icon}" class="w-4 h-4 shrink-0"></i>
              <span class="truncate">${tab.name}</span>
              ${badge}
            </button>
          `;
        });
        sidebar.innerHTML = sideHtml;
      }

      if (mobileNav) {
        let mobHtml = '';
        tabs.forEach(tab => {
          const active = currentTab === tab.id;
          mobHtml += `
            <button onclick="window.changeTab('${tab.id}')" class="flex flex-col items-center justify-center flex-1 py-1 px-1 transition-all ${active ? 'text-pinkglass-700 font-bold' : 'text-pinkglass-500'}">
              <i data-lucide="${tab.icon}" class="w-5 h-5 mb-0.5"></i>
              <span class="text-[10px] truncate max-w-[65px]">${tab.name}</span>
            </button>
          `;
        });
        mobileNav.innerHTML = mobHtml;
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    };

    /* ==========================================================
     * 3. ALL TAB RENDERERS (POS, ORDERS, KATALOG, STOK, BANK)
     * ========================================================== */
    window.formatOrderTime = function(isoString) {
      if (!isoString) return '-';
      try {
        const d = new Date(isoString);
        return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';
      } catch (e) { return '-'; }
    };

    window.getElapsedTimeFormatted = function(createdIso) {
      if (!createdIso) return '00m 00s';
      const created = new Date(createdIso).getTime();
      const diffMs = Math.max(0, Date.now() - created);
      const mins = Math.floor(diffMs / 60000);
      const secs = Math.floor((diffMs % 60000) / 1000);
      return `${String(mins).padStart(2, '0')}m ${String(secs).padStart(2, '0')}s`;
    };

    // --- TAB: SEDANG DALAM PROSES (KDS BOARD) ---
    window.renderKDS = function(container) {
      const activeOrders = appData.orders.filter(o => o.order_status !== 'Cancelled' && o.order_status !== 'Selesai');

      const dibuatList = activeOrders.filter(o => o.order_status === 'Dibuat' || o.order_status === 'Baking' || o.order_status === 'Pending');
      const dihiasList = activeOrders.filter(o => o.order_status === 'Dihias');
      const siapList = activeOrders.filter(o => o.order_status === 'Siap' || o.order_status === 'Ready');

      let html = `
        <div class="space-y-6 w-full">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 class="text-xl md:text-2xl font-bold text-charcoal flex items-center gap-2">
                <i data-lucide="chef-hat" class="w-6 h-6 text-pinkglass-600"></i>
                <span>SEDANG DALAM PROSES (KDS Queue)</span>
              </h2>
              <p class="text-xs text-pinkglass-800">Klik kartu pesanan pembeli untuk memindahkan status ke tahapan berikutnya hingga Selesai.</p>
            </div>
            <div class="flex items-center space-x-2 bg-pinkglass-100 px-3.5 py-1.5 rounded-2xl border border-pinkglass-200 shadow-xs">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span class="text-xs font-bold text-pinkglass-900">Live Stage Tracker Active</span>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
            <div class="bg-amber-50/50 p-4 rounded-3xl border border-amber-200/80 space-y-3 flex flex-col min-h-[500px]">
              <div class="flex justify-between items-center border-b border-amber-200 pb-2.5">
                <h3 class="font-extrabold text-sm text-amber-900 flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                  <span>Pesanan Sedang Dibuat</span>
                </h3>
                <span class="text-xs font-bold bg-amber-200 text-amber-900 px-2.5 py-0.5 rounded-full">${dibuatList.length}</span>
              </div>
              <div class="space-y-3 flex-1 overflow-y-auto max-h-[70vh] pr-1">
                ${dibuatList.length === 0 ? '<p class="text-xs text-amber-800/70 text-center py-8">Tidak ada pesanan sedang dibuat.</p>' : dibuatList.map(o => window.renderKDSCard(o, 'Proses ke Dihias →', 'bg-amber-500 hover:bg-amber-600')).join('')}
              </div>
            </div>

            <div class="bg-purple-50/50 p-4 rounded-3xl border border-purple-200/80 space-y-3 flex flex-col min-h-[500px]">
              <div class="flex justify-between items-center border-b border-purple-200 pb-2.5">
                <h3 class="font-extrabold text-sm text-purple-900 flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-purple-500"></span>
                  <span>Pesanan Sedang Dihias</span>
                </h3>
                <span class="text-xs font-bold bg-purple-200 text-purple-900 px-2.5 py-0.5 rounded-full">${dihiasList.length}</span>
              </div>
              <div class="space-y-3 flex-1 overflow-y-auto max-h-[70vh] pr-1">
                ${dihiasList.length === 0 ? '<p class="text-xs text-purple-800/70 text-center py-8">Tidak ada pesanan sedang dihias.</p>' : dihiasList.map(o => window.renderKDSCard(o, 'Proses ke Sudah Siap →', 'bg-purple-600 hover:bg-purple-700')).join('')}
              </div>
            </div>

            <div class="bg-emerald-50/50 p-4 rounded-3xl border border-emerald-200/80 space-y-3 flex flex-col min-h-[500px]">
              <div class="flex justify-between items-center border-b border-emerald-200 pb-2.5">
                <h3 class="font-extrabold text-sm text-emerald-900 flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>Pesanan Sudah Siap</span>
                </h3>
                <span class="text-xs font-bold bg-emerald-200 text-emerald-900 px-2.5 py-0.5 rounded-full">${siapList.length}</span>
              </div>
              <div class="space-y-3 flex-1 overflow-y-auto max-h-[70vh] pr-1">
                ${siapList.length === 0 ? '<p class="text-xs text-emerald-800/70 text-center py-8">Tidak ada pesanan siap.</p>' : siapList.map(o => window.renderKDSCard(o, 'Selesaikan Pesanan ✓', 'bg-emerald-600 hover:bg-emerald-700')).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    };

    window.renderKDSCard = function(o, btnText, btnColor) {
      const isOffline = String(o.order_type || '').includes('Offline');
      const itemsFormatted = (o.items && o.items.length > 0) 
        ? o.items.map(i => `${i.name || 'Kue'} (x${i.qty || 1})`).join(', ')
        : 'Pesanan Kue Artisan';

      return `
        <div class="bg-white p-4 rounded-2xl border border-pinkglass-200 space-y-3 shadow-xs hover:border-pinkglass-400 transition-all">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold bg-pinkglass-100 text-pinkglass-900 px-2 py-0.5 rounded-full font-mono">${o.order_id}</span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isOffline ? 'bg-amber-100 text-amber-800' : 'bg-sky-100 text-sky-800'}">${o.order_type}</span>
          </div>

          <div>
            <h4 class="font-extrabold text-charcoal text-sm">${o.customer_name}</h4>
            <div class="mt-1 bg-pinkglass-50 p-2 rounded-xl border border-pinkglass-100 text-xs font-semibold text-pinkglass-950 flex items-start gap-1">
              <span>🎂</span>
              <span class="line-clamp-2">${itemsFormatted}</span>
            </div>
            <p class="text-[11px] text-pinkglass-800 font-medium mt-1.5">🕒 Masuk: ${window.formatOrderTime(o.created_at)}</p>
          </div>

          <div class="pt-2 border-t border-pinkglass-100 flex items-center justify-between gap-2">
            <span class="font-mono text-[11px] font-bold text-pinkglass-900 bg-pinkglass-50 px-2 py-1 rounded-lg border border-pinkglass-200">
              ⏱️ ${window.getElapsedTimeFormatted(o.created_at)}
            </span>
            <button onclick="window.advanceOrderStatus('${o.order_id}')" class="${btnColor} text-white font-bold px-3 py-1.5 rounded-xl text-xs transition-all active:scale-95 shadow-2xs">
              ${btnText}
            </button>
          </div>

          <button onclick="window.cancelOrder('${o.order_id}')" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold py-1.5 rounded-xl text-[11px] transition-all border border-rose-200 flex items-center justify-center gap-1">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
            <span>Batalkan Pesanan (Restore Stok)</span>
          </button>
        </div>
      `;
    };

    window.advanceOrderStatus = function(orderId) {
      const ord = appData.orders.find(o => o.order_id === orderId);
      if (!ord) return;

      if (ord.order_status === 'Dibuat' || ord.order_status === 'Baking' || ord.order_status === 'Pending') {
        ord.order_status = 'Dihias';
      } else if (ord.order_status === 'Dihias') {
        ord.order_status = 'Siap';
      } else if (ord.order_status === 'Siap' || ord.order_status === 'Ready') {
        ord.order_status = 'Selesai';
      }

      window.renderNavigation();
      window.renderViewport();
    };

    window.cancelOrder = function(orderId) {
      if (!confirm(`Batalkan pesanan ${orderId}? Stok bahan baku akan dikembalikan.`)) return;
      const ord = appData.orders.find(o => o.order_id === orderId);
      if (ord) ord.order_status = 'Cancelled';
      window.renderNavigation();
      window.renderViewport();
    };

    // --- TAB: HALAMAN UTAMA (DASHBOARD) ---
    window.renderDashboard = function(container) {
      const activeCount = appData.orders.filter(o => ['Dibuat', 'Dihias', 'Siap', 'Pending'].includes(o.order_status)).length;
      const totalOmset = appData.orders.filter(o => o.order_status === 'Selesai').reduce((a, b) => a + (b.total_amount || 0), 0);

      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white/80 p-5 rounded-3xl border border-pinkglass-200 glass-card shadow-sm space-y-1">
              <span class="text-xs font-bold text-pinkglass-800 uppercase">Total Omset Selesai</span>
              <h3 class="text-2xl font-extrabold text-pinkglass-950">Rp ${totalOmset.toLocaleString('id-ID')}</h3>
            </div>
            <div class="bg-white/80 p-5 rounded-3xl border border-pinkglass-200 glass-card shadow-sm space-y-1">
              <span class="text-xs font-bold text-pinkglass-800 uppercase">Pesanan Aktif KDS</span>
              <h3 class="text-2xl font-extrabold text-amber-600">${activeCount} Antrean</h3>
            </div>
            <div class="bg-white/80 p-5 rounded-3xl border border-pinkglass-200 glass-card shadow-sm space-y-1">
              <span class="text-xs font-bold text-pinkglass-800 uppercase">Status Sistem</span>
              <h3 class="text-2xl font-extrabold text-emerald-600">Online Sync</h3>
            </div>
          </div>
        </div>
      `;
    };

    // --- TAB: PESANAN ONLINE MASUK ---
    window.renderWebOrders = function(container) {
      const activeOrders = appData.orders.filter(o => o.order_status !== 'Cancelled');
      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card">
            <h2 class="text-xl font-bold text-charcoal">Pesanan Online Masuk (Web)</h2>
            <p class="text-xs text-pinkglass-800">Daftar pesanan baru dari pelanggan via website.</p>
          </div>
          <div class="space-y-3">
            ${activeOrders.map(o => `
              <div class="bg-white p-4 rounded-2xl border border-pinkglass-200 flex justify-between items-center">
                <div>
                  <h4 class="font-bold text-charcoal text-sm">${o.customer_name} (${o.order_id})</h4>
                  <p class="text-xs text-pinkglass-800">Total: Rp ${o.total_amount.toLocaleString('id-ID')} | Status: ${o.order_status}</p>
                </div>
                <button onclick="window.advanceOrderStatus('${o.order_id}')" class="bg-pinkglass-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs">Terima & Masak</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    };

    // --- TAB: PESANAN OFFLINE (POS KASIR) ---
    window.renderPOS = function(container) {
      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card">
            <h2 class="text-xl font-bold text-charcoal">Pesanan Offline (Kasir Toko)</h2>
            <p class="text-xs text-pinkglass-800">Pencatatan kasir instan untuk transaksi langsung.</p>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            ${appData.products.map(p => `
              <div class="bg-white p-4 rounded-2xl border border-pinkglass-200 text-center space-y-2">
                <h4 class="font-bold text-xs text-charcoal">${p.name}</h4>
                <p class="text-xs font-bold text-pinkglass-700">Rp ${p.base_price.toLocaleString('id-ID')}</p>
                <button onclick="alert('Pesanan Ditambah')" class="bg-pinkglass-600 text-white text-[10px] font-bold px-3 py-1 rounded-lg">Pilih</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    };

    // --- TAB: KATALOG PRODUK ---
    window.renderCustomerCatalog = function(container) {
      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card">
            <h2 class="text-xl font-bold text-charcoal">Katalog Produk Kue</h2>
            <p class="text-xs text-pinkglass-800">Koleksi kue artisan Alessia Cake.</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${appData.products.map(p => `
              <div class="bg-white p-4 rounded-2xl border border-pinkglass-200 space-y-2">
                <img src="${p.image_url}" class="w-full h-32 object-cover rounded-xl">
                <h4 class="font-bold text-charcoal text-sm">${p.name}</h4>
                <p class="text-xs text-pinkglass-700 font-bold">Rp ${p.base_price.toLocaleString('id-ID')}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    };

    // --- TAB: RESEP KUE (BOM) ---
    window.renderBOMViewer = function(container) {
      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card">
            <h2 class="text-xl font-bold text-charcoal">Resep KUE (Bill of Materials)</h2>
            <p class="text-xs text-pinkglass-800">Takaran dan komposisi bahan baku otomatis.</p>
          </div>
          <div class="bg-white p-6 rounded-3xl border border-pinkglass-200 text-xs space-y-2">
            <p>• Pink Champagne Velvet: Terigu 350g, Ruby Chocolate 150g, Mentega 200g</p>
            <p>• Berry Croissant: Terigu 80g, Mentega 50g, Puree Berry 20ml</p>
          </div>
        </div>
      `;
    };

    // --- TAB: STOK BAHAN-BAHAN ---
    window.renderUpdateStock = function(container) {
      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card">
            <h2 class="text-xl font-bold text-charcoal">Stok Bahan-Bahan Dapur</h2>
            <p class="text-xs text-pinkglass-800">Pantau ketersediaan fisik bahan baku.</p>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-pinkglass-200">
            ${appData.ingredients.map(i => `
              <div class="flex justify-between py-2 border-b border-pinkglass-100 text-xs font-semibold">
                <span>${i.name}</span>
                <span class="text-pinkglass-900 font-bold">${i.current_stock} ${i.unit}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    };

    // --- TAB: BANK ALESSIA ---
    window.renderFinanceManager = function(container) {
      const totalIncome = appData.orders.filter(o => o.order_status === 'Selesai').reduce((a,b) => a + (b.total_amount || 0), 0);
      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card">
            <h2 class="text-xl font-bold text-charcoal">Bank Alessia - Laporan Keuangan</h2>
            <p class="text-xs text-pinkglass-800">Pemasukan dan pengeluaran kas toko.</p>
          </div>
          <div class="bg-white p-6 rounded-3xl border border-pinkglass-200 text-center space-y-2">
            <span class="text-xs font-bold text-pinkglass-800">TOTAL PEMASUKAN SAH</span>
            <h3 class="text-3xl font-extrabold text-emerald-600">Rp ${totalIncome.toLocaleString('id-ID')}</h3>
          </div>
        </div>
      `;
    };

    // --- TAB: PENGATURAN OWNER ---
    window.renderOwnerSettings = function(container) {
      container.innerHTML = `
        <div class="space-y-6 max-w-7xl mx-auto">
          <div class="bg-white/80 p-6 rounded-3xl border border-pinkglass-200 glass-card">
            <h2 class="text-xl font-bold text-charcoal">Pengaturan Owner</h2>
            <p class="text-xs text-pinkglass-800">Profil toko, PIN keamanan, dan printer thermal.</p>
          </div>
          <div class="bg-white p-6 rounded-3xl border border-pinkglass-200 text-xs space-y-3">
            <div>
              <label class="font-bold block mb-1">Nama Owner</label>
              <input type="text" value="${STORE_CONFIG.owner_name}" class="w-full border p-2 rounded-xl">
            </div>
            <div>
              <label class="font-bold block mb-1">PIN Staf</label>
              <input type="password" value="${STORE_CONFIG.staff_pin}" class="w-full border p-2 rounded-xl">
            </div>
          </div>
        </div>
      `;
    };

    // --- VIEWPORT ROUTER GLOBAL ---
    window.renderViewport = function() {
      const vp = document.getElementById('main-viewport');
      if (!vp) return;

      if (currentRole === 'customer') {
        if (currentTab === 'catalog') window.renderCustomerCatalog(vp);
        else vp.innerHTML = `<div class="bg-white p-6 rounded-3xl text-center">Modul Pelanggan</div>`;
      } else {
        if (currentTab === 'dashboard') window.renderDashboard(vp);
        else if (currentTab === 'web_orders') window.renderWebOrders(vp);
        else if (currentTab === 'offline_orders') window.renderPOS(vp);
        else if (currentTab === 'kds') window.renderKDS(vp);
        else if (currentTab === 'catalog') window.renderCustomerCatalog(vp);
        else if (currentTab === 'bom') window.renderBOMViewer(vp);
        else if (currentTab === 'update_stock') window.renderUpdateStock(vp);
        else if (currentTab === 'finance') window.renderFinanceManager(vp);
        else if (currentTab === 'settings') window.renderOwnerSettings(vp);
        else vp.innerHTML = `<div class="bg-white p-6 rounded-3xl text-center">Modul Siap</div>`;
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    };

    /* ==========================================================
     * INITIALIZATION BOOTSTRAPPER
     * ========================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      window.initLuxuryClock();
      const savedUser = localStorage.getItem('ALESSIA_USER');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          window.updateUserProfileDisplay();
          window.closeAuthModal();
          window.switchRole(currentUser.role || 'customer');
        } catch(e) {
          window.openAuthModal();
          window.switchRole('customer');
        }
      } else {
        window.openAuthModal();
        window.switchRole('customer');
      }
    });
  </script>
</body>
</html>
