<body class="h-full flex flex-col antialiased selection:bg-pinkglass-400 selection:text-white relative overflow-x-hidden">

      <!-- PURE VECTOR LUXURY LOGO EMBLEM FOR LOGIN -->

        <div class="relative flex items-center justify-center group mb-2.5">
          <!-- Outer Radiant Ring -->

                <path d="M12 2L15 7L20 4L18 13H6L4 4L9 7L12 2Z" fill="url(#modalBrandGrad)" stroke="none"/>

                <path d="M9 16H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <defs>
                  <linearGradient id="modalBrandGrad" x1="4" y1="2" x2="20" y2="13" gradientUnits="userSpaceOnUse">

        <h2 class="text-2xl sm:text-3xl font-extrabold text-pinkglass-950 font-luxury tracking-[0.18em] leading-none uppercase">

  <!-- INGREDIENT ADD / EDIT MODAL (FOR OWNER/ADMIN) -->

  <!-- LUXURY HERO HEADER BANNER (3-COLUMN PERFECT GRID WITH PURE VECTOR LOGO & SLEEK COMPACT HEIGHT) -->

      <!-- SISI TENGAH PRESISI (COLUMN 2): PURE VECTOR LOGO & TYPOGRAPHY -->

        <div class="flex items-center space-x-2.5">
          <!-- Scalable Royal Crown SVG Badge -->

              <span class="tracking-wider">Manis di Semua Moment</span>
              <span class="text-pinkglass-600">♥</span>
            </div>

      </div>

  <!-- MODULAR JS ENGINE INJECTION IN ORDER -->

  <!-- INITIALIZATION BOOTSTRAPPER -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Start Realtime Luxury Clock
      if (typeof window.initLuxuryClock === 'function') window.initLuxuryClock();

      const savedUrl = localStorage.getItem('ALESSIA_GAS_URL');
      if (savedUrl) GAS_API_URL = savedUrl;

      const savedUser = localStorage.getItem('ALESSIA_USER');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          window.updateUserProfileDisplay();
          window.closeAuthModal();
          window.switchRole(currentUser.role || 'customer');
        } catch(e) {
          window.openAuthModal();
          window.switchRole('customer');
        }
      } else {
        window.openAuthModal();
        window.switchRole('customer');
      }

      window.fetchInitialDataFromGAS();
    });
  </script>
</body>
</html>
